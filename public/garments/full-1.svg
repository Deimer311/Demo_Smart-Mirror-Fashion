<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="35%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="fold-shading" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#db2777" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Neckline and Shoulder straps -->
    <path d="M 140 100 C 145 75, 155 70, 160 70 C 165 70, 175 85, 175 100" fill="none" stroke="url(#silk)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 260 100 C 255 75, 245 70, 240 70 C 235 70, 225 85, 225 100" fill="none" stroke="url(#silk)" stroke-width="6" stroke-linecap="round"/>

    <!-- Bodice / Corset area -->
    <path d="M 135 100 C 135 100, 160 110, 200 110 C 240 110, 265 100, 265 100 C 275 145, 260 210, 250 240 C 210 255, 190 255, 150 240 C 140 210, 125 145, 135 100 Z" fill="url(#silk)"/>
    
    <!-- Sweetheart Neckline overlay -->
    <path d="M 135 100 C 150 85, 185 85, 200 105 C 215 85, 250 85, 265 100 C 260 140, 250 180, 245 210 C 220 220, 180 220, 155 210 C 150 180, 140 140, 135 100 Z" fill="#db2777" opacity="0.15"/>
    
    <!-- Waistband / Sash -->
    <path d="M 150 238 C 170 248, 230 248, 250 238 L 253 260 C 230 270, 170 270, 147 260 Z" fill="#9d174d"/>
    <path d="M 150 238 C 170 248, 230 248, 250 238 L 253 260 C 230 270, 170 270, 147 260 Z" fill="url(#silk)" opacity="0.5"/>

    <!-- Flowing Skirt (Maxi Dress style) -->
    <path d="M 147 260 C 120 380, 90 500, 70 600 C 140 620, 260 620, 330 600 C 310 500, 280 380, 253 260 C 210 275, 190 275, 147 260 Z" fill="url(#silk)"/>

    <!-- Skirt Draping and Folds (Adding depth and realism) -->
    <!-- Left side folds -->
    <path d="M 147 260 C 140 320, 120 450, 100 605 C 115 608, 135 608, 150 605 C 160 450, 170 320, 175 264 Z" fill="url(#fold-shading)" />
    <!-- Center folds -->
    <path d="M 200 268 C 195 350, 190 480, 200 612 C 205 612, 215 612, 220 611 C 210 480, 205 350, 208 268 Z" fill="url(#fold-shading)" />
    <!-- Right side folds -->
    <path d="M 253 260 C 260 320, 280 450, 300 605 C 285 608, 265 608, 250 605 C 240 450, 230 320, 225 264 Z" fill="url(#fold-shading)" />

    <!-- Draping overlay curves -->
    <path d="M 147 260 Q 200 300 253 260" fill="none" stroke="#be185d" stroke-width="2" opacity="0.4"/>
    <path d="M 130 340 Q 200 380 270 340" fill="none" stroke="#be185d" stroke-width="1.5" opacity="0.3"/>
    <path d="M 110 445 Q 200 485 290 445" fill="none" stroke="#be185d" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
