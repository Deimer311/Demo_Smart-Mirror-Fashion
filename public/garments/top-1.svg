<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d30"/>
      <stop offset="50%" stop-color="#1e1e20"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e9eab"/>
      <stop offset="50%" stop-color="#eef2f3"/>
      <stop offset="100%" stop-color="#8e9eab"/>
    </linearGradient>
    <linearGradient id="lapel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e3e42"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main Body Shadow & Jacket -->
  <g filter="url(#shadow)">
    <!-- Back Collar -->
    <path d="M 130 90 C 130 65, 270 65, 270 90 L 260 110 C 240 100, 160 100, 140 110 Z" fill="#121214"/>
    
    <!-- Left Sleeve -->
    <path d="M 130 90 C 90 120, 60 180, 50 280 C 60 290, 80 290, 90 280 C 100 210, 115 150, 135 125 Z" fill="url(#leather)"/>
    <!-- Left Sleeve Cuff -->
    <path d="M 50 280 C 60 290, 80 290, 90 280 L 85 295 C 75 302, 60 302, 45 295 Z" fill="#121214"/>
    <rect x="62" y="275" width="4" height="20" fill="url(#metal)" rx="1"/>

    <!-- Right Sleeve -->
    <path d="M 270 90 C 310 120, 340 180, 350 280 C 340 290, 320 290, 310 280 C 300 210, 285 150, 265 125 Z" fill="url(#leather)"/>
    <!-- Right Sleeve Cuff -->
    <path d="M 350 280 C 340 290, 320 290, 310 280 L 315 295 C 325 302, 340 302, 355 295 Z" fill="#121214"/>
    <rect x="334" y="275" width="4" height="20" fill="url(#metal)" rx="1"/>

    <!-- Torso Back Panel -->
    <path d="M 130 110 L 270 110 L 280 380 L 120 380 Z" fill="#18181b"/>

    <!-- Left Front Panel -->
    <path d="M 130 110 L 205 110 L 190 380 L 120 380 Z" fill="url(#leather)"/>

    <!-- Right Front Panel (Overlapping) -->
    <path d="M 185 110 L 270 110 L 280 380 L 180 380 Z" fill="url(#leather)"/>

    <!-- Left Lapel -->
    <path d="M 130 110 L 170 180 L 125 210 L 115 150 Z" fill="url(#lapel-grad)" stroke="#121214" stroke-width="1"/>
    <circle cx="132" cy="195" r="3" fill="url(#metal)"/>

    <!-- Right Lapel (Large Asymmetrical) -->
    <path d="M 270 110 L 210 200 L 285 240 L 280 160 Z" fill="url(#lapel-grad)" stroke="#121214" stroke-width="1"/>
    <circle cx="272" cy="222" r="3" fill="url(#metal)"/>

    <!-- Main Asymmetric Zipper -->
    <path d="M 205 110 L 180 380" stroke="url(#metal)" stroke-width="5" stroke-dasharray="1 1"/>
    <path d="M 197 180 L 190 205 L 195 205 L 202 180 Z" fill="url(#metal)"/> <!-- Zipper pull -->

    <!-- Pocket Zippers -->
    <!-- Left Chest Pocket -->
    <path d="M 140 180 L 165 170" stroke="url(#metal)" stroke-width="3"/>
    <circle cx="140" cy="180" r="2" fill="url(#metal)"/>
    <!-- Right Waist Pocket -->
    <path d="M 220 320 L 255 315" stroke="url(#metal)" stroke-width="3"/>
    <circle cx="255" cy="315" r="2" fill="url(#metal)"/>

    <!-- Belt loops and details at bottom hem -->
    <path d="M 120 380 L 280 380 C 280 380, 270 395, 250 395 L 150 395 C 130 395, 120 380, 120 380 Z" fill="#121214"/>
    <rect x="135" y="380" width="8" height="15" fill="#2d2d30" rx="1"/>
    <rect x="255" y="380" width="8" height="15" fill="#2d2d30" rx="1"/>
  </g>
</svg>
